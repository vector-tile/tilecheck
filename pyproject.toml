[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tilecheck"
version = "0.1.0"
description = "Audit PMTiles and MBTiles files: zoom-level size distributions, oversized-tile warnings, and metadata inspection."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "vector-tile", email = "288084635+vector-tile@users.noreply.github.com" },
]
keywords = [
    "pmtiles",
    "mbtiles",
    "vector-tiles",
    "gis",
    "mapping",
    "tippecanoe",
    "cartography",
    "maplibre",
    "mapbox",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
]
dependencies = [
    "pmtiles>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://www.vector-tile.com"
Repository = "https://github.com/vector-tile/tilecheck"
Issues = "https://github.com/vector-tile/tilecheck/issues"

[project.scripts]
tilecheck = "tilecheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tilecheck"]
